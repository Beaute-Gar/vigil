name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` : install reproductible à partir du lockfile.
      # Échoue si le lockfile et package.json divergent.
      - name: Install dependencies
        run: npm ci

      # La base n'est jamais un service externe en CI : les tests
      # d'intégration utilisent PGlite en mémoire (PostgreSQL en WASM).
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
